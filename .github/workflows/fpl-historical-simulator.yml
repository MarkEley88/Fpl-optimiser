name: FPL historical season simulation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/historical-simulator.mjs"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Simulate historical seasons
        run: node scripts/historical-simulator.mjs
