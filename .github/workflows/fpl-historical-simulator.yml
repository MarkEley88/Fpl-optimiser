name: FPL historical model training

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/historical-training.mjs"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Train on five historical seasons
        run: node scripts/historical-training.mjs
      - name: Save learned model parameters
        run: |
          git config user.name "fpl-training-bot"
          git config user.email "actions@github.com"
          git add lib/historical-model.ts
          git diff --cached --quiet || git commit -m "Update historical model weights"
          git push
