name: Refresh FPL live cache

# Refresh the fallback snapshot twice weekly. The multi-GW decision search is
# deliberately run on GitHub Actions rather than inside Vercel so it is not
# constrained by the web-function execution budget.
# Strategy guardrails: a 5-GW plan must add >=5 projected points versus Hold;
# Haaland (411) is a permanent anchor and may never be sold.
on:
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-fpl-cache.yml"
      - "scripts/decision-worker.ts"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live FPL data
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          base = "https://fantasy.premierleague.com/api"
          team_id = "1187241"
          endpoints = {"bootstrap":"/bootstrap-static/","fixtures":"/fixtures/","team":f"/entry/{team_id}/","history":f"/entry/{team_id}/history/"}
          headers = {"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept":"application/json, text/plain, */*","Accept-Language":"en-GB,en;q=0.9","Referer":"https://fantasy.premierleague.com/","Origin":"https://fantasy.premierleague.com"}
          def get(path):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(base+path,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
                  except Exception as e:
                      last=e;time.sleep(2*(attempt+1))
              raise last
          out={"generatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}
          for key,path in endpoints.items():out[key]=get(path)
          gw=out["team"].get("current_event") or (out["history"].get("current") or [{}])[-1].get("event") or 1
          out["picks"]=get(f"/entry/{team_id}/event/{gw}/picks/")
          path=pathlib.Path("data/fpl-cache.json");path.parent.mkdir(exist_ok=True);path.write_text(json.dumps(out,separators=(",",":")))
          print(f"Refreshed live cache for GW {gw}.")
          PY

      - name: Incrementally learn completed current-season gameweeks
        run: node scripts/current-season-training.mjs

      - name: Broaden exact-search frontier for worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lib/engine.ts")
          s=p.read_text()
          replacements={
            "const BEAM=20;":"const BEAM=300;",
            "slice(0,12);":"slice(0,50);",
            "slice(0,8);":"slice(0,30);",
            "slice(0,6);":"slice(0,20);",
            ".slice(0,32);":".slice(0,200);"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected search control not found: {old}")
              s=s.replace(old,new)
          marker='''    // Rank once per state. The continuation value for a funding state was
    // calculated when that state was created; do not recursively search future
    // transfers during sorting.
          '''
          patch='''    // Safe dominance pruning before the global beam:
    // For an identical future-relevant state, a state with no less bank and
    // no less accumulated score dominates the weaker state.
    const dominated=new Map<string,any[]>();
    for(const candidate of next){
      const key=[
        gw+1,
        candidate.squad.map((x:any)=>Number(x.player.id)).sort((a:number,b:number)=>a-b).join(","),
        Number(candidate.ft),
        [...(candidate.usedChips||[])].sort().join(","),
        JSON.stringify(candidate.recentMoves||[])
      ].join("|");
      const bucket=dominated.get(key)||[];
      let isDominated=false;
      for(const prior of bucket){
        if(prior.total>=candidate.total-1e-9 && prior.bank>=candidate.bank-1e-9){
          isDominated=true;
          break;
        }
      }
      if(isDominated)continue;
      const survivors=bucket.filter((prior:any)=>
        !(candidate.total>=prior.total-1e-9 && candidate.bank>=prior.bank-1e-9)
      );
      survivors.push(candidate);
      dominated.set(key,survivors);
    }
    const prunedNext=[...dominated.values()].flat();
    console.log("[decision-plan] dominance",next.length,"->",prunedNext.length);

    // Rank once per state. The continuation value for a funding state was
    // calculated when that state was created; do not recursively search future
    // transfers during sorting.
          '''
          if marker not in s:
              raise SystemExit("Expected global-state ranking marker not found")
          s=s.replace(marker,patch,1)
          s=s.replace("next.sort((a:any,b:any)=>(b.total+fixedFuture(b.squad,gw+1))-(a.total+fixedFuture(a.squad,gw+1)));\n    states=next.slice(0,BEAM);",
                      "prunedNext.sort((a:any,b:any)=>(b.total+fixedFuture(b.squad,gw+1))-(a.total+fixedFuture(a.squad,gw+1)));\n    states=prunedNext.slice(0,BEAM);",1)
          p.write_text(s)
          print("Worker search frontier broadened with safe state-dominance pruning: global beam=300, same-GW path beam=200, exact paths=30.")
          PY

      - name: Run multi-gameweek decision worker
        run: npx --yes tsx scripts/decision-worker.ts

      - name: Commit cache, model and decision plan
        run: |
          if git diff --quiet -- data/fpl-cache.json lib/current-season-model.ts data/current-season-live.json data/decision-plan.json; then
            echo "No cache, model or decision-plan change."
            exit 0
          fi
          git config user.name "fpl-optimiser-bot"
          git config user.email "fpl-optimiser-bot@users.noreply.github.com"
          git add data/fpl-cache.json data/current-season-live.json lib/current-season-model.ts scripts/current-season-training.mjs data/decision-plan.json scripts/decision-worker.ts
          git commit -m "chore: refresh FPL cache, model and decision plan"
          git push origin HEAD:main
