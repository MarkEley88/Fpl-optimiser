name: Refresh FPL live cache

# Keep a persistent snapshot available to the Vercel app when the FPL API
# temporarily blocks Vercel egress. GitHub Actions refreshes the snapshot;
# Vercel reads it only when the live API fails.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live FPL data
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time

          base = "https://fantasy.premierleague.com/api"
          team_id = "1187241"
          endpoints = {
              "bootstrap": "/bootstrap-static/",
              "fixtures": "/fixtures/",
              "team": f"/entry/{team_id}/",
              "history": f"/entry/{team_id}/history/",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-GB,en;q=0.9",
              "Referer": "https://fantasy.premierleague.com/",
              "Origin": "https://fantasy.premierleague.com",
          }

          def get(path):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(2 * (attempt + 1))
              raise last

          out = {"generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          for key, path in endpoints.items():
              out[key] = get(path)

          gw = out["team"].get("current_event") or (out["history"].get("current") or [{}])[-1].get("event") or 1
          out["picks"] = get(f"/entry/{team_id}/event/{gw}/picks/")

          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/fpl-cache.json").write_text(json.dumps(out, separators=(",", ":")))
          print("Cached GW", gw, "at", out["generatedAt"])
          PY
      - name: Commit cache snapshot
        run: |
          git config user.name "MarkEley88"
          git config user.email "329544909+MarkEley88@users.noreply.github.com"
          git add data/fpl-cache.json
          if git diff --cached --quiet; then
            echo "Cache unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh FPL cache snapshot"
          git push origin HEAD:main
