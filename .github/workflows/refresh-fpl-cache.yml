name: Refresh FPL live cache

# Refresh the fallback snapshot without creating frequent Vercel deployments.
# The snapshot is only committed when the current gameweek changes.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live FPL data
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time

          base = "https://fantasy.premierleague.com/api"
          team_id = "1187241"

          endpoints = {
              "bootstrap": "/bootstrap-static/",
              "fixtures": "/fixtures/",
              "team": f"/entry/{team_id}/",
              "history": f"/entry/{team_id}/history/",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-GB,en;q=0.9",
              "Referer": "https://fantasy.premierleague.com/",
              "Origin": "https://fantasy.premierleague.com",
          }

          def get(path):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(2 * (attempt + 1))
              raise last

          out = {"generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}

          for key, path in endpoints.items():
              out[key] = get(path)

          gw = (
              out["team"].get("current_event")
              or (out["history"].get("current") or [{}])[-1].get("event")
              or 1
          )

          out["picks"] = get(f"/entry/{team_id}/event/{gw}/picks/")

          path = pathlib.Path("data/fpl-cache.json")
          old_gw = None

          if path.exists():
              try:
                  old = json.loads(path.read_text())
                  old_gw = (
                      old.get("team", {}).get("current_event")
                      or (old.get("history", {}).get("current") or [{}])[-1].get("event")
                  )
              except Exception:
                  pass

          if old_gw == gw:
              print(f"Cache already represents GW {gw}; no Git commit required.")
              raise SystemExit(0)

          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(out, separators=(",", ":")))
          print(f"Updated fallback cache from GW {old_gw} to GW {gw} at {out['generatedAt']}")
          PY

      - name: Commit only when gameweek changes
        run: |
          if git diff --quiet -- data/fpl-cache.json; then
            echo "No cache change; no deployment will be triggered."
            exit 0
          fi

          git config user.name "fpl-optimiser-bot"
          git config user.email "fpl-optimiser-bot@users.noreply.github.com"
          git add data/fpl-cache.json
          git commit -m "chore: refresh FPL cache for new gameweek"
          git push origin HEAD:main
