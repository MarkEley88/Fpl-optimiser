name: Refresh FPL live cache

# Refresh the fallback snapshot twice weekly. The multi-GW decision search is
# deliberately run on GitHub Actions rather than inside Vercel so it is not
# constrained by the web-function execution budget.
# Strategy guardrail: a 7-GW plan must add >=5 projected points versus Hold.
# Player selection is model/constraint driven; no player is hard-coded as unsellable.
on:
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-fpl-cache.yml"
      - "scripts/decision-worker.ts"
      - "lib/engine.ts"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live FPL data
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          base = "https://fantasy.premierleague.com/api"
          team_id = "1187241"
          endpoints = {"bootstrap":"/bootstrap-static/","fixtures":"/fixtures/","team":f"/entry/{team_id}/","history":f"/entry/{team_id}/history/"}
          headers = {"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept":"application/json, text/plain, */*","Accept-Language":"en-GB,en;q=0.9","Referer":"https://fantasy.premierleague.com/","Origin":"https://fantasy.premierleague.com"}
          def get(path):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(base+path,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
                  except Exception as e:
                      last=e;time.sleep(2*(attempt+1))
              raise last
          out={"generatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}
          for key,path in endpoints.items():out[key]=get(path)
          gw=out["team"].get("current_event") or (out["history"].get("current") or [{}])[-1].get("event") or 1
          out["picks"]=get(f"/entry/{team_id}/event/{gw}/picks/")
          path=pathlib.Path("data/fpl-cache.json");path.parent.mkdir(exist_ok=True);path.write_text(json.dumps(out,separators=(",",":")))
          print(f"Refreshed live cache for GW {gw}.")
          PY

      - name: Incrementally learn completed current-season gameweeks
        run: node scripts/current-season-training.mjs

      - name: Apply production search hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lib/engine.ts")
          s=p.read_text()
          replacements={
              '            if(outId===411)continue;\n':'',
              '          // Haaland is a permanent squad anchor: wildcard rebuilds may not remove him.\n          if(!rebuilt.squad.some((x:any)=>Number(x.player?.id)===411))continue;\n':'',
              '          // Free Hit is temporary, but the optimiser still treats Haaland as a hard anchor.\n          if(!best.some((p:any)=>Number(p.id)===411))continue;\n':'',
              '    const planDiagnostics=decisionPlanDiagnostics(current,pool,fixtures,gw,Number(bank||0),getFT(history,gw,entryHistory));\n':'    const planDiagnostics=planOnly?decisionPlanDiagnostics(current,pool,fixtures,gw,Number(bank||0),getFT(history,gw,entryHistory)):null;\n',
              '        strategyGain7GW:strategyGain,minimumStrategyGain:minimumStrategyGain,haalandLocked:true':'        strategyGain7GW:strategyGain,minimumStrategyGain:minimumStrategyGain'
          }
          changed=0
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new)
                  changed+=1
          if changed<3:
              raise SystemExit(f"Expected production search hardening was not fully applied; changed={changed}")
          p.write_text(s)
          print(f"Applied {changed} production search hardening changes: no hard-coded player lock; diagnostics are opt-in; output no longer claims a player lock.")
          PY

      - name: Validate production search controls
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("lib/engine.ts").read_text()
          if "const BEAM=300;" not in s:
              raise SystemExit("Expected production BEAM=300 control not found.")
          if "if(outId===411)continue;" in s:
              raise SystemExit("Hard-coded Haaland transfer lock still present.")
          print("Using bounded production frontier with admissible-bound pruning and model-driven player selection.")
          PY

      - name: Run multi-gameweek decision worker
        run: npx --yes tsx scripts/decision-worker.ts

      - name: Commit cache, model, engine and decision plan
        run: |
          if git diff --quiet -- data/fpl-cache.json lib/current-season-model.ts data/current-season-live.json data/decision-plan.json lib/engine.ts scripts/current-season-training.mjs scripts/decision-worker.ts; then
            echo "No cache, model, engine or decision-plan change."
            exit 0
          fi
          git config user.name "fpl-optimiser-bot"
          git config user.email "fpl-optimiser-bot@users.noreply.github.com"
          git add data/fpl-cache.json data/current-season-live.json lib/current-season-model.ts lib/engine.ts scripts/current-season-training.mjs data/decision-plan.json scripts/decision-worker.ts
          git commit -m "chore: harden FPL decision search"
          git push origin HEAD:main
