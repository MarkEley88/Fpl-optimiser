name: Refresh FPL live cache

# Refresh the fallback snapshot twice weekly. The multi-GW decision search is
# deliberately run on GitHub Actions rather than inside Vercel so it is not
# constrained by the web-function execution budget.
# Strategy guardrail: a 7-GW plan must add >=5 projected points versus Hold.
# Player selection is model/constraint driven; no player is hard-coded as unsellable.
on:
  schedule:
    - cron: "0 7 * * 2"
    - cron: "0 7 * * 5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-fpl-cache.yml"
      - "scripts/decision-worker.ts"
      - "lib/engine.ts"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live FPL data
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          base = "https://fantasy.premierleague.com/api"
          team_id = "1187241"
          endpoints = {"bootstrap":"/bootstrap-static/","fixtures":"/fixtures/","team":f"/entry/{team_id}/","history":f"/entry/{team_id}/history/","transfers":f"/entry/{team_id}/transfers/"}
          headers = {"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept":"application/json, text/plain, */*","Accept-Language":"en-GB,en;q=0.9","Referer":"https://fantasy.premierleague.com/","Origin":"https://fantasy.premierleague.com"}
          def get(path):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(base+path,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
                  except Exception as e:
                      last=e;time.sleep(2*(attempt+1))
              raise last
          out={"generatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}
          for key,path in endpoints.items():out[key]=get(path)
          gw=int(out["team"].get("current_event") or (out["history"].get("current") or [{}])[-1].get("event") or 1)
          out["picks"]=get(f"/entry/{team_id}/event/{gw}/picks/")

          # FPL can continue reporting the last completed/current event for a
          # period after its matches finish. Reconstruct the manager's actual
          # current squad by applying any transfers made after that locked GW.
          post=[t for t in (out.get("transfers") or []) if int(t.get("event") or 0)>gw]
          current_picks=list(out["picks"].get("picks") or [])
          by_out={int(t.get("element_out")):t for t in post}
          for pick in current_picks:
              eid=int(pick.get("element") or 0)
              if eid in by_out:
                  pick["element"]=int(by_out[eid].get("element_in"))
          entry_history=dict(out["picks"].get("entry_history") or {})
          bank=int(entry_history.get("bank") or 0)
          for t in post:
              bank += int(t.get("element_out_cost") or 0)-int(t.get("element_in_cost") or 0)
          decision_gw=gw+1
          ft=max(0,min(2,1-len(post)))
          out["current_squad"]={"event":decision_gw,"picks":current_picks,"entry_history":{**entry_history,"event":decision_gw,"bank":bank,"event_transfers":len(post),"event_transfers_available":ft}}
          out["decision_event"]=decision_gw
          out["current_bank"]=bank
          out["current_free_transfers"]=ft
          out["post_completed_gw_transfers"]=post
          path=pathlib.Path("data/fpl-cache.json");path.parent.mkdir(exist_ok=True);path.write_text(json.dumps(out,separators=(",",":")))
          print(f"Refreshed live cache for completed/current GW {gw}; decision GW {decision_gw}; applied {len(post)} post-GW transfer(s); FT={ft}; bank={bank/10:.1f}m.")
          PY

      - name: Incrementally learn completed current-season gameweeks
        run: node scripts/current-season-training.mjs

      - name: Validate production search controls
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("lib/engine.ts").read_text()
          if "const BEAM=300;" not in s:
              raise SystemExit("Expected production BEAM=300 control not found.")
          if "if(outId===411)continue;" in s:
              raise SystemExit("Hard-coded Haaland transfer lock still present.")
          if "planOnly?decisionPlanDiagnostics" not in s:
              raise SystemExit("Expected production diagnostics to be opt-in.")
          print("Using bounded production frontier with admissible-bound pruning and model-driven player selection.")
          PY

      - name: Run multi-gameweek decision worker
        run: npx --yes tsx scripts/decision-worker.ts

      - name: Commit cache, model, engine and decision plan
        run: |
          if git diff --quiet -- data/fpl-cache.json lib/current-season-live.json lib/current-season-model.ts data/decision-plan.json lib/engine.ts scripts/current-season-training.mjs scripts/decision-worker.ts; then
            echo "No cache, model, engine or decision-plan change."
            exit 0
          fi
          git config user.name "fpl-optimiser-bot"
          git config user.email "fpl-optimiser-bot@users.noreply.github.com"
          git add data/fpl-cache.json data/current-season-live.json lib/current-season-model.ts data/decision-plan.json lib/engine.ts scripts/current-season-training.mjs scripts/decision-worker.ts
          git commit -m "chore: refresh FPL decision cache"
          git push origin HEAD:main
