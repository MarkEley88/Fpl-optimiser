name: FPL historical backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/backtest.mjs"
      - "package.json"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run walk-forward backtest
        run: npm run backtest
